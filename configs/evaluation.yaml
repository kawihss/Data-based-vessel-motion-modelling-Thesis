run:
  name: tryx trex
  description: first try
  seed: 42
  sample_pct: 1 #of 100

sampling:
  tuning_validation_pct: 1 #of 100
  evaluation_pct: 1 #of 100

paths:
  baseline_root: output/08_baseline_results

data:
  parquet_dir: output/07_parquet
  split: test
  context_filter_tuning: river
  context_filter_evaluation: river

evaluation:
  export_predictions: true

models:
  cv: true
  ctrv: false
  ctrv_arc: false
  hybrid: false
  kalman: false
  ctrv_ekf: false
  tirex_lstm: true
  tirex:
    model_name: NX-AI/TiRex
    device: null # null-> auto-detect, or specify "cpu" or "cuda"
    backend: torch # torch as fallback for windows, use cuda on linux, recommended and faster
    compile_model: false
    scaler_path: output/05_normalized/scalers.pkl

tuning:
  n_trials_standard: 30
  n_trials_tirex: 1
  n_trials_hybrid: 200
  n_trials_kalman: 200
  n_trials_ctrv_ekf: 200
  early_stopping_patience: 50
  early_stopping_min_delta: 0.0001

plotting:
  step_duration_s: 30
  models:
    constant_velocity: true
    ctrv: false
    ctrv_arc: false
    hybrid_cv_ctrv: false
    kalman: false
    ctrv_ekf: false
    tirex_lstm: true
