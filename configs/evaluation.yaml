run:
  name: baseline_river_river
  description: Running all baselines models on river context tracks, with river context filter for tuning and evaluation.
  seed: 42
  sample_pct: 100 #of 100

sampling:
  tuning_validation_pct: 100 #of 100
  evaluation_pct: 100 #of 100

paths:
  baseline_root: output/08_baseline_results

data:
  parquet_dir: output/07_parquet
  split: test
  context_filter_tuning: river
  context_filter_evaluation: river

evaluation:
  export_predictions: true

models:
  cv: true
  ctrv: true
  ctrv_arc: true
  hybrid: true
  kalman: true
  ctrv_ekf: true
  tirex_lstm: false
  tirex:
    model_name: NX-AI/TiRex
    device: cuda # null-> auto-detect, or specify "cpu" or "cuda"
    backend: cuda # torch as fallback for windows, use cuda on linux, recommended and faster
    compile_model: true
    scaler_path: output/05_normalized/scalers.pkl

tuning:
  n_trials_standard: 30
  n_trials_tirex: 1 # just testing if it runs
  n_trials_hybrid: 200
  n_trials_kalman: 200
  n_trials_ctrv_ekf: 200
  early_stopping_patience: 50
  early_stopping_min_delta: 0.0001

plotting:
  step_duration_s: 30
  models:
    constant_velocity: true
    ctrv: true
    ctrv_arc: true
    hybrid_cv_ctrv: true
    kalman: true
    ctrv_ekf: true
    tirex_lstm: false
